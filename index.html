<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>InstaGrab</title>

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/725/725339.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/128/725/725339.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body.light { --bg: #ffffff; --surface: #f5f5f5; --primary: #405DE6; --text: #111; --text-secondary: #666; --border: #e0e0e0; --online: #4caf50; --offline: #9e9e9e; --error: #f44336; --input-bg: #fff; --notification: #ef4444; --success: #4caf50; }
        body.dark { --bg: #121212; --surface: #1e1e1e; --primary: #bb86fc; --text: #eee; --text-secondary: #aaa; --border: #2c2c2c; --online: #4caf50; --offline: #757575; --error: #cf6679; --input-bg: #2c2c2c; --notification: #ef4444; --success: #4caf50; }
        body.futuristic { --bg: #0a0e27; --surface: #16213e; --primary: #00f2fe; --text: #fff; --text-secondary: #cbd5e1; --border: #2d3748; --online: #0f0; --offline: #4a5568; --error: #f06; --input-bg: #1a234a; --notification: #ff4444; --success: #00ff88; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.2s;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-card {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .auth-icon { 
            font-size: 70px; 
            margin-bottom: 15px;
            display: inline-block;
            background: linear-gradient(135deg, #405DE6, #833AB4);
            border-radius: 20px;
            padding: 15px;
            color: white;
        }
        .auth-card input {
            width: 100%; padding: 14px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 12px;
            font-size: 16px;
        }
        .btn {
            width: 100%; padding: 14px;
            background: #405DE6; color: white;
            border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary {
            background: none; border: none;
            color: #405DE6; cursor: pointer;
            margin-top: 15px; font-size: 14px;
        }
        
        .header {
            background: var(--surface);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 8px; }
        .logo-icon { 
            font-size: 28px; 
            background: linear-gradient(135deg, #405DE6, #833AB4);
            border-radius: 10px;
            padding: 4px;
            color: white;
        }
        .logo-text { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--primary), #833AB4); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-icons { display: flex; gap: 12px; align-items: center; }
        .icon-btn {
            background: none; border: none;
            font-size: 22px; cursor: pointer;
            padding: 6px; border-radius: 50%;
            color: var(--text);
            position: relative;
        }
        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--notification);
            color: white;
            border-radius: 50%;
            min-width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            z-index: 200;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 12px;
            position: relative;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 22px; }
        .nav-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--notification);
            color: white;
            border-radius: 50%;
            min-width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }
        .nav-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        
        .users-list, .discover-list {
            padding: 10px;
            padding-bottom: 70px;
        }
        .user-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.1s;
        }
        .user-card:active { transform: scale(0.99); }
        .avatar-container { position: relative; margin-right: 14px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--surface);
        }
        .user-details { flex: 1; }
        .user-name { font-weight: 600; font-size: 15px; }
        .user-bio { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .last-msg { font-size: 11px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .unread-badge {
            background: var(--error);
            color: white;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }
        
        .chat-container { height: 100vh; display: flex; flex-direction: column; }
        .chat-header {
            background: var(--surface);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: none; border: none;
            font-size: 24px; cursor: pointer;
            color: var(--text);
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            word-wrap: break-word;
            position: relative;
        }
        .message-mine {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message-theirs {
            background: var(--surface);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message-time {
            font-size: 9px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }
        .message-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 4px;
        }
        .message-actions button {
            background: none; border: none;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .input-area {
            padding: 12px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
        }
        .input-area input:focus { outline: none; border-color: var(--primary); }
        
        .profile-container { min-height: 100vh; padding-bottom: 70px; }
        .profile-header {
            background: var(--surface);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            display: block;
            border: 3px solid var(--primary);
            cursor: pointer;
        }
        .profile-stats {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            margin: 20px;
            background: var(--surface);
            border-radius: 16px;
        }
        .stat { text-align: center; cursor: pointer; }
        .stat-number { font-size: 22px; font-weight: bold; }
        .stat-label { font-size: 12px; color: var(--text-secondary); }
        
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--surface);
            border-radius: 24px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80%;
            overflow-y: auto;
        }
        .notification-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 1000;
            font-size: 13px;
            border: 1px solid var(--border);
        }
        
        @media (max-width: 768px) {
            .message { max-width: 85%; }
            .auth-card { margin: 20px; padding: 30px 25px; }
        }
    </style>
</head>
<body>
    <div id="app"><div class="loading">Loading...</div></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXfH_DdBYRs_icgNVrs0CaEgGBovZU7C0",
            authDomain: "instgrab-eb68e.firebaseapp.com",
            projectId: "instgrab-eb68e",
            storageBucket: "instgrab-eb68e.firebasestorage.app",
            messagingSenderId: "1062907185656",
            appId: "1:1062907185656:web:6e740ce63238ddc44eae0d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // Request notification permission
        if ('Notification' in window && Notification.permission !== 'granted') {
            Notification.requestPermission();
        }
        
        function playNotificationSound() {
            try {
                let audio = new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3');
                audio.volume = 0.3;
                audio.play().catch(()=>{});
            } catch(e) {}
        }
        
        function sendPushNotification(title, body, icon) {
            if (Notification.permission === 'granted') {
                new Notification(title, { body, icon: icon || 'https://img.icons8.com/color/96/chat--v1.png' });
                playNotificationSound();
            }
        }
        
        let currentUser = null;
        let currentTheme = localStorage.getItem('theme') || 'light';
        let currentTab = 'login';
        let selectedUser = null;
        let viewingUser = null;
        let chatUsers = [];
        let unreadCounts = new Map();
        let lastMessages = new Map();
        let lastTimes = new Map();
        let messagesUnsub = null;
        let pendingFile = null;
        let notifications = [];
        let notifCount = 0;
        let isLoading = false;
        let usersLoaded = false;
        
        const CLOUD_NAME = "dx1irhsdq";
        const UPLOAD_PRESET = "instagrab_preset";
        
        async function uploadToCloudinary(file) {
            let fd = new FormData();
            fd.append('file', file);
            fd.append('upload_preset', UPLOAD_PRESET);
            let res = await axios.post(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, fd);
            return res.data.secure_url;
        }
        
        function getDefaultAvatar(name) {
            let initial = name ? name.charAt(0).toUpperCase() : 'U';
            return `https://ui-avatars.com/api/?background=405DE6&color=fff&size=120&name=${initial}`;
        }
        
        function showToast(msg) {
            let existing = document.querySelector('.toast');
            if (existing) existing.remove();
            let toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        function applyTheme() {
            document.body.className = currentTheme;
            localStorage.setItem('theme', currentTheme);
            render();
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            let div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatTime(date) {
            if (!date) return '';
            let now = new Date();
            let diff = now - date;
            let mins = Math.floor(diff / 60000);
            let hours = Math.floor(diff / 3600000);
            let days = Math.floor(diff / 86400000);
            if (mins < 1) return 'Just now';
            if (mins < 60) return `${mins}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        }
        
        function getBadge(count) {
            if (count === 0) return '';
            return count > 9 ? '9+' : count.toString();
        }
        
        function updatePresence(online) {
            if (currentUser) {
                db.collection('users').doc(currentUser.uid).update({ online, lastSeen: new Date() }).catch(()=>{});
            }
        }
        window.addEventListener('load', () => updatePresence(true));
        window.addEventListener('beforeunload', () => updatePresence(false));
        document.addEventListener('visibilitychange', () => updatePresence(!document.hidden));
        
        async function loadNotifications() {
            if (!currentUser) return;
            try {
                let followSnap = await db.collection('followRequests').where('toId', '==', currentUser.uid).where('status', '==', 'pending').get();
                let msgSnap = await db.collection('messageRequests').where('toId', '==', currentUser.uid).where('status', '==', 'pending').get();
                let all = [];
                followSnap.forEach(d => {
                    let data = d.data();
                    all.push({ id: d.id, type: 'follow', fromId: data.fromId, fromName: data.fromName, fromPhoto: data.fromPhoto, msg: `${data.fromName} wants to follow you`, time: data.createdAt?.toDate?.() || new Date() });
                });
                msgSnap.forEach(d => {
                    let data = d.data();
                    all.push({ id: d.id, type: 'message', fromId: data.fromId, fromName: data.fromName, fromPhoto: data.fromPhoto, msg: `Message request from ${data.fromName}`, time: data.createdAt?.toDate?.() || new Date() });
                });
                all.sort((a,b) => b.time - a.time);
                notifications = all;
                notifCount = all.length;
                render();
            } catch(e) { console.error(e); }
        }
        
        function showNotifModal() {
            if (notifications.length === 0) { showToast('No notifications'); return; }
            let modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 style="margin-bottom:15px;">Notifications (${notifCount})</h3>
                    ${notifications.map(n => `
                        <div class="notification-item">
                            <img src="${n.fromPhoto || getDefaultAvatar(n.fromName)}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;">
                            <div style="flex:1;">
                                <div style="font-weight:600;">${escapeHtml(n.fromName)}</div>
                                <div style="font-size:12px;color:var(--text-secondary);">${escapeHtml(n.msg)}</div>
                                <div style="font-size:10px;color:var(--text-secondary);margin-top:4px;">${formatTime(n.time)}</div>
                            </div>
                            <div style="display:flex;gap:8px;">
                                <button class="btn" onclick="handleNotif('accept','${n.id}','${n.type}','${n.fromId}');this.closest('.modal').remove();" style="padding:6px 12px;font-size:12px;width:auto;">Accept</button>
                                <button class="btn" onclick="handleNotif('reject','${n.id}','${n.type}');this.closest('.modal').remove();" style="padding:6px 12px;font-size:12px;width:auto;background:var(--error);">Reject</button>
                            </div>
                        </div>
                    `).join('')}
                    <button class="btn" onclick="this.closest('.modal').remove()" style="margin-top:15px;">Close</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        async function handleNotif(action, id, type, fromId) {
            if (action === 'accept') {
                if (type === 'follow') {
                    await db.collection('followRequests').doc(id).update({ status: 'accepted' });
                    await db.collection('users').doc(currentUser.uid).update({ followers: firebase.firestore.FieldValue.arrayUnion(fromId) });
                    await db.collection('users').doc(fromId).update({ following: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
                    showToast('Follow request accepted');
                } else {
                    await db.collection('messageRequests').doc(id).update({ status: 'accepted' });
                    showToast('Message request accepted');
                }
            } else {
                if (type === 'follow') await db.collection('followRequests').doc(id).update({ status: 'rejected' });
                else await db.collection('messageRequests').doc(id).update({ status: 'rejected' });
                showToast('Request rejected');
            }
            await loadNotifications();
            render();
        }
        
        // 🔥 SUPER FAST - Loads users instantly from cache
        function loadChatUsers() {
            let container = document.getElementById('usersList');
            if (!container) return;
            
            // If we already have users, display immediately
            if (chatUsers.length > 0) {
                displayChatUsers(chatUsers);
                // Refresh in background
                refreshChatUsers();
                return;
            }
            
            // First load - show loading
            container.innerHTML = '<div class="loading">Loading chats...</div>';
            refreshChatUsers();
        }
        
        async function refreshChatUsers() {
            if (isLoading) return;
            isLoading = true;
            
            try {
                let snapshot = await db.collection('users').where('uid', '!=', currentUser.uid).get();
                let all = [];
                snapshot.forEach(doc => all.push({ id: doc.id, ...doc.data() }));
                
                let chatUsersList = [];
                for (let user of all) {
                    let chatId = [currentUser.uid, user.id].sort().join('_');
                    let lastMsg = await db.collection(`chats/${chatId}/messages`).orderBy('timestamp', 'desc').limit(1).get();
                    if (!lastMsg.empty) {
                        let data = lastMsg.docs[0].data();
                        lastMessages.set(user.id, data.text || '📎');
                        lastTimes.set(user.id, data.timestamp?.toDate?.() || new Date(0));
                        let unread = await db.collection(`chats/${chatId}/messages`).where('receiverId', '==', currentUser.uid).where('read', '==', false).get();
                        unreadCounts.set(user.id, unread.size);
                        chatUsersList.push(user);
                    }
                }
                
                chatUsersList.sort((a, b) => {
                    let timeA = lastTimes.get(a.id) || new Date(0);
                    let timeB = lastTimes.get(b.id) || new Date(0);
                    return timeB - timeA;
                });
                
                chatUsers = chatUsersList;
                displayChatUsers(chatUsers);
            } catch(e) { console.error(e); }
            isLoading = false;
        }
        
        function displayChatUsers(users) {
            let container = document.getElementById('usersList');
            if (!container) return;
            
            if (users.length === 0) {
                container.innerHTML = '<div class="loading">✨ No chats yet! Go to Discover to find friends.</div>';
                return;
            }
            
            container.innerHTML = users.map(user => {
                let unread = unreadCounts.get(user.id) || 0;
                let last = lastMessages.get(user.id) || '';
                let avatar = user.photoURL || getDefaultAvatar(user.username);
                let unreadBadge = unread > 9 ? '9+' : (unread > 0 ? unread : '');
                let time = lastTimes.get(user.id);
                let timeDisplay = time ? formatTime(time) : '';
                
                return `
                    <div class="user-card" onclick="openChat('${user.id}')">
                        <div class="avatar-container">
                            <img src="${avatar}" class="avatar" onerror="this.src='${getDefaultAvatar(user.username)}'">
                            <div class="online-dot" style="background: ${user.online ? 'var(--online)' : 'var(--offline)'};"></div>
                        </div>
                        <div class="user-details">
                            <div class="user-name">${escapeHtml(user.username)}</div>
                            <div class="last-msg">${last ? escapeHtml(last.substring(0,40)) : 'Say hi!'}</div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            ${timeDisplay ? `<div style="font-size:10px;color:var(--text-secondary);">${timeDisplay}</div>` : ''}
                            ${unreadBadge ? `<div class="unread-badge">${unreadBadge}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function loadDiscoverUsers() {
            let container = document.getElementById('discoverList');
            if (!container) return;
            container.innerHTML = '<div class="loading">Finding users...</div>';
            try {
                let snapshot = await db.collection('users').where('uid', '!=', currentUser.uid).get();
                let users = [];
                snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
                for (let u of users) {
                    u.isFollowing = u.followers?.includes(currentUser.uid) || false;
                }
                container.innerHTML = users.map(user => {
                    let avatar = user.photoURL || getDefaultAvatar(user.username);
                    let followBtn = user.isFollowing ? 
                        `<button class="btn" style="padding:6px 16px; font-size:12px; width:auto; background:var(--text-secondary);" onclick="event.stopPropagation(); handleFollow('unfollow','${user.id}')">Following</button>` :
                        `<button class="btn" style="padding:6px 16px; font-size:12px; width:auto;" onclick="event.stopPropagation(); handleFollow('follow','${user.id}')">Follow</button>`;
                    return `
                        <div class="user-card" onclick="viewProfile('${user.id}')">
                            <div class="avatar-container">
                                <img src="${avatar}" class="avatar" onerror="this.src='${getDefaultAvatar(user.username)}'">
                                <div class="online-dot" style="background: ${user.online ? 'var(--online)' : 'var(--offline)'};"></div>
                            </div>
                            <div class="user-details">
                                <div class="user-name">${escapeHtml(user.username)}</div>
                                <div class="user-bio">${escapeHtml(user.name || user.username)}</div>
                            </div>
                            ${followBtn}
                            <button class="icon-btn" style="font-size:18px;" onclick="event.stopPropagation(); openChat('${user.id}')">💬</button>
                        </div>
                    `;
                }).join('');
            } catch(e) { console.error(e); }
        }
        
        async function handleFollow(action, userId) {
            let userRef = db.collection('users').doc(userId);
            let curRef = db.collection('users').doc(currentUser.uid);
            let userDoc = await userRef.get();
            if (action === 'follow') {
                await userRef.update({ followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
                await curRef.update({ following: firebase.firestore.FieldValue.arrayUnion(userId) });
                showToast(`Following ${userDoc.data().username}`);
                await db.collection('followRequests').add({
                    fromId: currentUser.uid, fromName: currentUser.displayName, fromPhoto: currentUser.photoURL,
                    toId: userId, status: 'pending', createdAt: new Date()
                });
            } else {
                await userRef.update({ followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
                await curRef.update({ following: firebase.firestore.FieldValue.arrayRemove(userId) });
                showToast(`Unfollowed ${userDoc.data().username}`);
            }
            loadDiscoverUsers();
            loadNotifications();
        }
        
        async function openChat(userId) {
            await db.collection('messageRequests').where('fromId','==',userId).where('toId','==',currentUser.uid).where('status','==','pending').get().then(snap => {
                snap.forEach(d => d.ref.update({ status: 'accepted' }));
            });
            await loadNotifications();
            let userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                selectedUser = { id: userDoc.id, ...userDoc.data() };
                currentTab = 'chat';
                render();
            }
        }
        
        async function editMessage(msgId, oldText) {
            let newText = prompt('Edit message:', oldText);
            if (!newText || newText === oldText) return;
            let chatId = [currentUser.uid, selectedUser.id].sort().join('_');
            await db.collection(`chats/${chatId}/messages`).doc(msgId).update({ text: newText, edited: true });
            showToast('Message edited');
        }
        
        async function deleteMessage(msgId) {
            if (!confirm('Delete this message?')) return;
            let chatId = [currentUser.uid, selectedUser.id].sort().join('_');
            await db.collection(`chats/${chatId}/messages`).doc(msgId).update({ deleted: true, text: 'Message deleted' });
            showToast('Message deleted');
        }
        
        async function loadMessages() {
            let container = document.getElementById('messagesArea');
            if (!container || !selectedUser) return;
            let chatId = [currentUser.uid, selectedUser.id].sort().join('_');
            if (messagesUnsub) messagesUnsub();
            messagesUnsub = db.collection(`chats/${chatId}/messages`).orderBy('timestamp').onSnapshot(async snap => {
                if (snap.empty) { container.innerHTML = '<div class="loading">No messages yet</div>'; return; }
                let msgs = [];
                snap.forEach(d => {
                    let data = d.data();
                    msgs.push({ id: d.id, text: data.text, senderId: data.senderId, timestamp: data.timestamp?.toDate?.() || new Date(), read: data.read, attachment: data.attachment, edited: data.edited, deleted: data.deleted });
                });
                container.innerHTML = msgs.map(m => {
                    let isMine = m.senderId === currentUser.uid;
                    let time = m.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    let status = isMine ? (m.read ? 'Seen' : 'Sent') : '';
                    let content = '';
                    if (m.deleted) {
                        content = '<em>Message deleted</em>';
                    } else if (m.attachment) {
                        content = `<img src="${m.attachment}" style="max-width:200px;max-height:200px;border-radius:10px;cursor:pointer;" onclick="window.open('${m.attachment}','_blank')">`;
                    } else {
                        content = escapeHtml(m.text);
                    }
                    let editedBadge = m.edited ? ' <span style="font-size:10px;">(edited)</span>' : '';
                    let actions = '';
                    if (isMine && !m.deleted) {
                        actions = `<div class="message-actions">
                            <button onclick="editMessage('${m.id}','${escapeHtml(m.text).replace(/'/g, "\\'")}')">✏️ Edit</button>
                            <button onclick="deleteMessage('${m.id}')">🗑️ Delete</button>
                        </div>`;
                    }
                    return `
                        <div class="message ${isMine ? 'message-mine' : 'message-theirs'}">
                            ${content}${editedBadge}
                            <div class="message-time">${time} <span style="font-size:10px;">${status}</span></div>
                            ${actions}
                        </div>
                    `;
                }).join('');
                container.scrollTop = container.scrollHeight;
                let unread = msgs.filter(m => !m.read && m.senderId !== currentUser.uid);
                if (unread.length) {
                    let batch = db.batch();
                    unread.forEach(m => batch.update(db.collection(`chats/${chatId}/messages`).doc(m.id), { read: true }));
                    await batch.commit();
                    if (currentTab === 'chat') {
                        sendPushNotification(`New message from ${selectedUser.username}`, msgs[msgs.length-1]?.text || 'Sent you a message', selectedUser.photoURL);
                    }
                }
            });
        }
        
        async function sendMessage() {
            let input = document.getElementById('messageInput');
            let text = input?.value.trim();
            if (!text && !pendingFile) return;
            let chatId = [currentUser.uid, selectedUser.id].sort().join('_');
            if (pendingFile) {
                try {
                    let url = await uploadToCloudinary(pendingFile);
                    await db.collection(`chats/${chatId}/messages`).add({ attachment: url, senderId: currentUser.uid, receiverId: selectedUser.id, timestamp: new Date(), read: false });
                    pendingFile = null;
                    document.getElementById('filePreview')?.remove();
                    showToast('Image sent!');
                } catch(e) { showToast('Upload failed'); }
            }
            if (text) {
                await db.collection(`chats/${chatId}/messages`).add({ text, senderId: currentUser.uid, receiverId: selectedUser.id, timestamp: new Date(), read: false });
                input.value = '';
                lastTimes.set(selectedUser.id, new Date());
                refreshChatUsers();
            }
        }
        
        function attachFile() {
            let input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                let file = e.target.files[0];
                if (file) {
                    pendingFile = file;
                    let preview = document.getElementById('filePreview');
                    if (!preview) {
                        preview = document.createElement('div');
                        preview.id = 'filePreview';
                        preview.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);padding:10px 15px;border-radius:20px;display:flex;gap:10px;z-index:1000;border:1px solid var(--border);';
                        document.body.appendChild(preview);
                    }
                    let reader = new FileReader();
                    reader.onload = (ev) => { preview.innerHTML = `<img src="${ev.target.result}" style="width:40px;height:40px;border-radius:8px;"><span>${file.name.substring(0,20)}</span><button onclick="cancelAttachment()">✕</button>`; };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }
        
        function cancelAttachment() { pendingFile = null; document.getElementById('filePreview')?.remove(); }
        
        async function viewProfile(userId) {
            viewingUser = userId;
            currentTab = 'viewProfile';
            render();
        }
        
        async function loadProfile(userId = null) {
            let uid = userId || currentUser.uid;
            let container = document.getElementById('profileContent');
            if (!container) return;
            let doc = await db.collection('users').doc(uid).get();
            let user = doc.data();
            let avatar = user.photoURL || getDefaultAvatar(user.username);
            let isOwn = uid === currentUser.uid;
            let isFollowing = user.followers?.includes(currentUser.uid) || false;
            container.innerHTML = `
                <div style="padding:20px;">
                    <img src="${avatar}" class="profile-avatar" onerror="this.src='${getDefaultAvatar(user.username)}'" ${isOwn ? 'onclick="editPhoto()"' : ''}>
                    <h2 style="text-align:center;">${escapeHtml(user.username)}</h2>
                    <p style="text-align:center;color:var(--text-secondary);">${escapeHtml(user.name || user.username)}</p>
                    <div style="text-align:center;padding:0 20px;color:var(--text-secondary);">${user.bio || 'No bio yet'}</div>
                    <div class="profile-stats">
                        <div class="stat" onclick="showFollowList('followers','${uid}')"><div class="stat-number">${user.followers?.length || 0}</div><div class="stat-label">Followers</div></div>
                        <div class="stat" onclick="showFollowList('following','${uid}')"><div class="stat-number">${user.following?.length || 0}</div><div class="stat-label">Following</div></div>
                    </div>
                    ${!isOwn ? `
                        <button class="btn" onclick="handleProfileFollow('${uid}')" style="margin-bottom:10px;">${isFollowing ? 'Unfollow' : 'Follow'}</button>
                        <button class="btn" onclick="openChat('${uid}')" style="background:var(--text-secondary);">Send Message</button>
                    ` : `
                        <button class="btn" onclick="editPhoto()" style="margin-bottom:10px;">📸 Change Photo</button>
                        <button class="btn" onclick="toggleTheme()" style="margin-bottom:10px;">🎨 Theme</button>
                        <button class="btn" onclick="logout()" style="background:var(--error);">Logout</button>
                    `}
                </div>
            `;
        }
        
        async function handleProfileFollow(userId) {
            let userRef = db.collection('users').doc(userId);
            let curRef = db.collection('users').doc(currentUser.uid);
            let userDoc = await userRef.get();
            let isFollowing = userDoc.data()?.followers?.includes(currentUser.uid);
            if (isFollowing) {
                await userRef.update({ followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
                await curRef.update({ following: firebase.firestore.FieldValue.arrayRemove(userId) });
                showToast(`Unfollowed ${userDoc.data().username}`);
            } else {
                await userRef.update({ followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
                await curRef.update({ following: firebase.firestore.FieldValue.arrayUnion(userId) });
                showToast(`Following ${userDoc.data().username}`);
                await db.collection('followRequests').add({
                    fromId: currentUser.uid, fromName: currentUser.displayName, fromPhoto: currentUser.photoURL,
                    toId: userId, status: 'pending', createdAt: new Date()
                });
                await loadNotifications();
            }
            loadProfile(userId);
            loadDiscoverUsers();
        }
        
        async function editPhoto() {
            let input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                let file = e.target.files[0];
                if (file) {
                    showToast('Uploading...');
                    try {
                        let url = await uploadToCloudinary(file);
                        await db.collection('users').doc(currentUser.uid).update({ photoURL: url });
                        await currentUser.updateProfile({ photoURL: url });
                        showToast('Photo updated!');
                        render();
                    } catch(e) { showToast('Upload failed'); }
                }
            };
            input.click();
        }
        
        async function showFollowList(type, userId) {
            let doc = await db.collection('users').doc(userId).get();
            let ids = type === 'followers' ? (doc.data()?.followers || []) : (doc.data()?.following || []);
            if (ids.length === 0) { showToast(`No ${type}`); return; }
            let users = [];
            for (let id of ids) {
                let u = await db.collection('users').doc(id).get();
                if (u.exists) users.push({ id: u.id, ...u.data() });
            }
            let modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 style="margin-bottom:15px;">${type === 'followers' ? 'Followers' : 'Following'}</h3>
                    ${users.map(u => `
                        <div class="user-card" style="margin-bottom:10px;" onclick="viewProfile('${u.id}'); document.querySelector('.modal').remove()">
                            <img src="${u.photoURL || getDefaultAvatar(u.username)}" class="avatar" style="width:44px;height:44px;">
                            <div class="user-details"><div class="user-name">${escapeHtml(u.username)}</div><div class="user-bio">${escapeHtml(u.name || u.username)}</div></div>
                        </div>
                    `).join('')}
                    <button class="btn" onclick="this.closest('.modal').remove()" style="margin-top:15px;">Close</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function goToChats() { currentTab = 'chats'; selectedUser = null; render(); loadChatUsers(); }
        function goToDiscover() { currentTab = 'discover'; render(); loadDiscoverUsers(); }
        function goToProfile() { currentTab = 'profile'; render(); }
        function goBack() { if (messagesUnsub) messagesUnsub(); currentTab = 'chats'; selectedUser = null; render(); loadChatUsers(); }
        function toggleTheme() { let themes = ['light','dark','futuristic']; let idx = themes.indexOf(currentTheme); currentTheme = themes[(idx+1)%3]; applyTheme(); showToast(`${currentTheme} theme`); }
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        
        async function logout() {
            await updatePresence(false);
            chatUsers = [];
            unreadCounts.clear();
            lastMessages.clear();
            lastTimes.clear();
            notifications = [];
            notifCount = 0;
            if (messagesUnsub) messagesUnsub();
            await auth.signOut();
            currentUser = null;
            currentTab = 'login';
            render();
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            let email = document.getElementById('loginEmail').value;
            let pass = document.getElementById('loginPassword').value;
            try { await auth.signInWithEmailAndPassword(email, pass); } catch(err) { alert(err.message); }
        }
        
        async function handleSignup(e) {
            e.preventDefault();
            let username = document.getElementById('signupUsername').value;
            let name = document.getElementById('signupName').value;
            let email = document.getElementById('signupEmail').value;
            let pass = document.getElementById('signupPassword').value;
            let confirm = document.getElementById('signupConfirm').value;
            if (pass !== confirm) { alert('Passwords do not match'); return; }
            try {
                let cred = await auth.createUserWithEmailAndPassword(email, pass);
                await cred.user.updateProfile({ displayName: username });
                await db.collection('users').doc(cred.user.uid).set({
                    uid: cred.user.uid, username, name: name || username, email,
                    photoURL: getDefaultAvatar(username), bio: '',
                    isPrivate: false, followers: [], following: [],
                    online: true, lastSeen: new Date(), createdAt: new Date()
                });
                showToast('Account created! Please login.');
                currentTab = 'login';
                render();
            } catch(err) { alert(err.message); }
        }
        
        function showLogin() { currentTab = 'login'; render(); }
        function showSignup() { currentTab = 'signup'; render(); }
        
        function totalUnread() { let t = 0; for (let c of unreadCounts.values()) t += c; return t; }
        
        function render() {
            let app = document.getElementById('app');
            if (!currentUser) {
                if (currentTab === 'signup') {
                    app.innerHTML = `
                        <div class="auth-container">
                            <div class="auth-card">
                                <div class="auth-icon">💬</div>
                                <h2 style="margin-bottom: 20px;">InstaGrab</h2>
                                <form id="signupForm">
                                    <input type="text" id="signupUsername" placeholder="Username">
                                    <input type="text" id="signupName" placeholder="Full Name">
                                    <input type="email" id="signupEmail" placeholder="Email">
                                    <input type="password" id="signupPassword" placeholder="Password">
                                    <input type="password" id="signupConfirm" placeholder="Confirm">
                                    <button type="submit" class="btn">Sign Up</button>
                                </form>
                                <button class="btn-secondary" onclick="showLogin()">Back to Login</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('signupForm')?.addEventListener('submit', handleSignup);
                } else {
                    app.innerHTML = `
                        <div class="auth-container">
                            <div class="auth-card">
                                <div class="auth-icon">💬</div>
                                <h2 style="margin-bottom: 20px;">InstaGrab</h2>
                                <form id="loginForm">
                                    <input type="email" id="loginEmail" placeholder="Email">
                                    <input type="password" id="loginPassword" placeholder="Password">
                                    <button type="submit" class="btn">Login</button>
                                </form>
                                <button class="btn-secondary" onclick="showSignup()">Create account</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('loginForm')?.addEventListener('submit', handleLogin);
                }
                return;
            }
            
            let unreadTotal = totalUnread();
            let unreadBadge = getBadge(unreadTotal);
            let notifBadge = getBadge(notifCount);
            
            if (currentTab === 'chat') {
                app.innerHTML = `
                    <div class="chat-container">
                        <div class="chat-header">
                            <button class="back-btn" onclick="goBack()">←</button>
                            <img src="${selectedUser?.photoURL || getDefaultAvatar(selectedUser?.username)}" class="avatar" style="width:44px;height:44px;cursor:pointer;" onclick="viewProfile('${selectedUser?.id}')">
                            <div style="flex:1;cursor:pointer;" onclick="viewProfile('${selectedUser?.id}')">
                                <div class="user-name">${escapeHtml(selectedUser?.username)}</div>
                                <div style="font-size:11px;">${selectedUser?.online ? '🟢 Online' : '⚫ Offline'}</div>
                            </div>
                        </div>
                        <div id="messagesArea" class="messages-area"><div class="loading">Loading...</div></div>
                        <div class="input-area">
                            <button class="icon-btn" onclick="attachFile()">📎</button>
                            <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                            <button class="btn" onclick="sendMessage()" style="width:auto;padding:12px 20px;">Send</button>
                        </div>
                    </div>
                `;
                loadMessages();
            } else if (currentTab === 'discover') {
                app.innerHTML = `
                    <div>
                        <div class="header">
                            <div class="logo">
                                <span class="logo-icon">💬</span>
                                <span class="logo-text">InstaGrab</span>
                            </div>
                            <div class="header-icons">
                                <button class="icon-btn" onclick="showNotifModal()" style="position:relative;">
                                    <i class="fas fa-bell"></i>
                                    ${notifBadge ? `<span class="badge">${notifBadge}</span>` : ''}
                                </button>
                                <button class="icon-btn" onclick="goToProfile()">
                                    <img src="${currentUser?.photoURL || getDefaultAvatar(currentUser?.displayName)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
                                </button>
                                <button class="icon-btn" onclick="toggleTheme()">🎨</button>
                            </div>
                        </div>
                        <div id="discoverList" class="discover-list"><div class="loading">Finding users...</div></div>
                        <div class="bottom-nav">
                            <button class="nav-item" onclick="goToChats()" style="position:relative;">
                                <i class="fas fa-comment"></i>
                                <span>Chats</span>
                                ${unreadBadge ? `<span class="nav-badge">${unreadBadge}</span>` : ''}
                            </button>
                            <button class="nav-item active" onclick="goToDiscover()"><i class="fas fa-compass"></i><span>Discover</span></button>
                            <button class="nav-item" onclick="goToProfile()"><i class="fas fa-user"></i><span>Profile</span></button>
                        </div>
                    </div>
                `;
                loadDiscoverUsers();
            } else if (currentTab === 'profile') {
                app.innerHTML = `
                    <div class="profile-container">
                        <div class="profile-header">
                            <button class="back-btn" onclick="goToChats()">←</button>
                            <h2>My Profile</h2>
                        </div>
                        <div id="profileContent"><div class="loading">Loading...</div></div>
                        <div class="bottom-nav">
                            <button class="nav-item" onclick="goToChats()" style="position:relative;">
                                <i class="fas fa-comment"></i>
                                <span>Chats</span>
                                ${unreadBadge ? `<span class="nav-badge">${unreadBadge}</span>` : ''}
                            </button>
                            <button class="nav-item" onclick="goToDiscover()"><i class="fas fa-compass"></i><span>Discover</span></button>
                            <button class="nav-item active" onclick="goToProfile()"><i class="fas fa-user"></i><span>Profile</span></button>
                        </div>
                    </div>
                `;
                loadProfile();
            } else if (currentTab === 'viewProfile') {
                app.innerHTML = `
                    <div class="profile-container">
                        <div class="profile-header">
                            <button class="back-btn" onclick="goBack()">←</button>
                            <h2>Profile</h2>
                        </div>
                        <div id="profileContent"><div class="loading">Loading...</div></div>
                    </div>
                `;
                loadProfile(viewingUser);
            } else {
                app.innerHTML = `
                    <div>
                        <div class="header">
                            <div class="logo">
                                <span class="logo-icon">💬</span>
                                <span class="logo-text">InstaGrab</span>
                            </div>
                            <div class="header-icons">
                                <button class="icon-btn" onclick="showNotifModal()" style="position:relative;">
                                    <i class="fas fa-bell"></i>
                                    ${notifBadge ? `<span class="badge">${notifBadge}</span>` : ''}
                                </button>
                                <button class="icon-btn" onclick="goToProfile()">
                                    <img src="${currentUser?.photoURL || getDefaultAvatar(currentUser?.displayName)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
                                </button>
                                <button class="icon-btn" onclick="toggleTheme()">🎨</button>
                            </div>
                        </div>
                        <div id="usersList" class="users-list"><div class="loading">Loading chats...</div></div>
                        <div class="bottom-nav">
                            <button class="nav-item active" onclick="goToChats()" style="position:relative;">
                                <i class="fas fa-comment"></i>
                                <span>Chats</span>
                                ${unreadBadge ? `<span class="nav-badge">${unreadBadge}</span>` : ''}
                            </button>
                            <button class="nav-item" onclick="goToDiscover()"><i class="fas fa-compass"></i><span>Discover</span></button>
                            <button class="nav-item" onclick="goToProfile()"><i class="fas fa-user"></i><span>Profile</span></button>
                        </div>
                    </div>
                `;
                loadChatUsers();
                loadNotifications();
            }
        }
        
        window.openChat = openChat;
        window.sendMessage = sendMessage;
        window.viewProfile = viewProfile;
        window.goToChats = goToChats;
        window.goToDiscover = goToDiscover;
        window.goToProfile = goToProfile;
        window.goBack = goBack;
        window.toggleTheme = toggleTheme;
        window.logout = logout;
        window.showLogin = showLogin;
        window.showSignup = showSignup;
        window.showFollowList = showFollowList;
        window.attachFile = attachFile;
        window.cancelAttachment = cancelAttachment;
        window.editPhoto = editPhoto;
        window.showNotifModal = showNotifModal;
        window.handleNotif = handleNotif;
        window.handleFollow = handleFollow;
        window.handleProfileFollow = handleProfileFollow;
        window.editMessage = editMessage;
        window.deleteMessage = deleteMessage;
        window.handleKeyPress = handleKeyPress;
        
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                let ref = db.collection('users').doc(user.uid);
                let doc = await ref.get();
                if (!doc.exists) {
                    await ref.set({
                        uid: user.uid, username: user.displayName || user.email.split('@')[0], email: user.email,
                        photoURL: getDefaultAvatar(user.displayName || user.email), bio: '',
                        isPrivate: false, followers: [], following: [],
                        online: true, lastSeen: new Date(), createdAt: new Date()
                    });
                }
                currentTab = 'chats';
                await loadNotifications();
                db.collection('followRequests').where('toId','==',currentUser.uid).onSnapshot(() => loadNotifications());
                db.collection('messageRequests').where('toId','==',currentUser.uid).onSnapshot(() => loadNotifications());
            }
            render();
        });
        
        applyTheme();
    </script>
</body>
</html>
