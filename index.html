<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>InstaGrab - Chat with ease</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/96/chat.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Theme Variables - Global */
        body.light {
            --bg: #ffffff;
            --surface: #f5f5f5;
            --primary: #405DE6;
            --text: #111111;
            --text-secondary: #666666;
            --border: #e0e0e0;
            --online: #4caf50;
            --offline: #9e9e9e;
            --error: #f44336;
            --input-bg: #ffffff;
        }
        body.dark {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --text: #eeeeee;
            --text-secondary: #aaaaaa;
            --border: #2c2c2c;
            --online: #4caf50;
            --offline: #757575;
            --error: #cf6679;
            --input-bg: #2c2c2c;
        }
        body.futuristic {
            --bg: #0a0e27;
            --surface: #16213e;
            --primary: #00f2fe;
            --text: #ffffff;
            --text-secondary: #cbd5e1;
            --border: #2d3748;
            --online: #00ff88;
            --offline: #4a5568;
            --error: #ff006e;
            --input-bg: #1a234a;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.2s;
        }
        
        /* Chat Theme Overrides */
        .chat-theme-default { }
        .chat-theme-romantic { --chat-bg: #ffe6f0; --chat-primary: #ff6b9d; --chat-surface: #fff0f5; }
        .chat-theme-dark { --chat-bg: #1a1a2e; --chat-primary: #16213e; --chat-surface: #0f3460; }
        .chat-theme-nature { --chat-bg: #e8f5e9; --chat-primary: #2e7d32; --chat-surface: #c8e6c9; }
        
        /* Auth */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-card {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-card h1 { color: #405DE6; text-align: center; font-size: 42px; margin-bottom: 20px; }
        .auth-card input {
            width: 100%; padding: 14px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 12px;
            font-size: 16px;
        }
        .btn {
            width: 100%; padding: 14px;
            background: #405DE6; color: white;
            border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary {
            background: none; border: none;
            color: #405DE6; cursor: pointer;
            margin-top: 15px; font-size: 14px;
        }
        
        /* Header */
        .header {
            background: var(--surface);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h2 { font-size: 20px; color: var(--primary); }
        .header-icons { display: flex; gap: 12px; align-items: center; }
        .icon-btn {
            background: none; border: none;
            font-size: 22px; cursor: pointer;
            padding: 6px; border-radius: 50%;
            color: var(--text);
            position: relative;
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            z-index: 200;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 12px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 22px; }
        .nav-avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        /* User Card */
        .users-list, .discover-list {
            padding: 10px;
            padding-bottom: 70px;
        }
        .user-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            position: relative;
        }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 14px;
            object-fit: cover;
            position: relative;
        }
        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--surface);
        }
        .user-details { flex: 1; }
        .user-name { font-weight: 600; font-size: 15px; }
        .user-bio { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .notification-badge {
            background: var(--error);
            color: white;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            padding: 0 5px;
        }
        
        /* Chat */
        .chat-container { height: 100vh; display: flex; flex-direction: column; }
        .chat-header {
            background: var(--surface);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header-avatar { cursor: pointer; }
        .back-btn {
            background: none; border: none;
            font-size: 24px; cursor: pointer;
            color: var(--text);
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--chat-bg, var(--bg));
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            word-wrap: break-word;
        }
        .message-mine {
            background: var(--chat-primary, var(--primary));
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message-theirs {
            background: var(--chat-surface, var(--surface));
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message-time {
            font-size: 9px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }
        .input-area {
            padding: 12px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
        }
        
        /* Profile */
        .profile-container { min-height: 100vh; padding-bottom: 70px; }
        .profile-header {
            background: var(--surface);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            display: block;
            border: 3px solid var(--primary);
            cursor: pointer;
        }
        .profile-stats {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            margin: 20px;
            background: var(--surface);
            border-radius: 16px;
        }
        .stat { text-align: center; cursor: pointer; }
        .stat-number { font-size: 22px; font-weight: bold; }
        .stat-label { font-size: 12px; color: var(--text-secondary); }
        
        /* Edit Profile Modal */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--surface);
            border-radius: 24px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80%;
            overflow-y: auto;
        }
        .theme-option {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .loading { text-align: center; padding: 50px; color: var(--text-secondary); }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 1000;
            font-size: 13px;
            border: 1px solid var(--border);
        }
        
        .file-input { display: none; }
        
        @media (max-width: 768px) {
            .message { max-width: 85%; }
            .auth-card { margin: 20px; padding: 30px 25px; }
        }
    </style>
</head>
<body>
    <div id="app"><div class="loading">Loading...</div></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyAXfH_DdBYRs_icgNVrs0CaEgGBovZU7C0",
            authDomain: "instgrab-eb68e.firebaseapp.com",
            projectId: "instgrab-eb68e",
            storageBucket: "instgrab-eb68e.firebasestorage.app",
            messagingSenderId: "1062907185656",
            appId: "1:1062907185656:web:6e740ce63238ddc44eae0d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // ========== APP STATE ==========
        let currentUser = null;
        let currentTheme = localStorage.getItem('theme') || 'light';
        let currentScreen = 'login';
        let selectedUser = null;
        let viewingProfileUser = null;
        let usersCache = [];
        let unreadCounts = new Map();
        let lastMessages = new Map();
        let messagesUnsubscribe = null;
        let chatThemes = JSON.parse(localStorage.getItem('chatThemes') || '{}');
        let pendingFile = null;
        
        // Cloudinary Config
        const CLOUD_NAME = "dx1irhsdq";
        const UPLOAD_PRESET = "instagrab_preset";
        
        async function uploadToCloudinary(file) {
            let fd = new FormData();
            fd.append('file', file);
            fd.append('upload_preset', UPLOAD_PRESET);
            let res = await axios.post(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, fd);
            return res.data.secure_url;
        }
        
        // ========== HELPERS ==========
        function getDefaultAvatar(name) {
            let initial = name ? name.charAt(0).toUpperCase() : 'U';
            return `https://ui-avatars.com/api/?background=405DE6&color=fff&size=120&name=${initial}`;
        }
        
        function showToast(msg) {
            let existing = document.querySelector('.toast');
            if (existing) existing.remove();
            let toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
        
        function applyTheme() {
            document.body.className = currentTheme;
            localStorage.setItem('theme', currentTheme);
            render();
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            let div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ========== PRESENCE ==========
        function updatePresence(online) {
            if (currentUser) {
                db.collection('users').doc(currentUser.uid).update({ online, lastSeen: new Date() }).catch(()=>{});
            }
        }
        
        window.addEventListener('load', () => { updatePresence(true); });
        window.addEventListener('beforeunload', () => { updatePresence(false); });
        document.addEventListener('visibilitychange', () => { updatePresence(!document.hidden); });
        
        // ========== LOAD USERS (CACHED) ==========
        async function loadUsers() {
            let container = document.getElementById('usersList');
            if (!container) return;
            
            if (usersCache.length > 0) {
                displayUsers(usersCache);
            } else {
                container.innerHTML = '<div class="loading">Loading users...</div>';
            }
            
            try {
                let snapshot = await db.collection('users').where('uid', '!=', currentUser.uid).get();
                let users = [];
                snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
                
                await Promise.all(users.map(async (user) => {
                    let chatId = [currentUser.uid, user.id].sort().join('_');
                    let lastMsg = await db.collection(`chats/${chatId}/messages`).orderBy('timestamp', 'desc').limit(1).get();
                    if (!lastMsg.empty) {
                        lastMessages.set(user.id, lastMsg.docs[0].data().text || '📎');
                    }
                    let unread = await db.collection(`chats/${chatId}/messages`).where('receiverId', '==', currentUser.uid).where('read', '==', false).get();
                    unreadCounts.set(user.id, unread.size);
                }));
                
                usersCache = users;
                displayUsers(users);
            } catch(err) { console.error(err); }
        }
        
        function displayUsers(users) {
            let container = document.getElementById('usersList');
            if (!container) return;
            if (users.length === 0) {
                container.innerHTML = '<div class="loading">No users yet</div>';
                return;
            }
            
            container.innerHTML = users.map(user => {
                let unread = unreadCounts.get(user.id) || 0;
                let lastMsg = lastMessages.get(user.id) || '';
                let avatar = user.photoURL || getDefaultAvatar(user.username);
                return `
                    <div class="user-card" onclick="openChat('${user.id}')">
                        <div style="position: relative;">
                            <img src="${avatar}" class="avatar" onerror="this.src='${getDefaultAvatar(user.username)}'">
                            <div class="online-indicator" style="background: ${user.online ? 'var(--online)' : 'var(--offline)'};"></div>
                        </div>
                        <div class="user-details">
                            <div class="user-name">${escapeHtml(user.username)}</div>
                            <div class="user-bio">${lastMsg ? escapeHtml(lastMsg.substring(0, 40)) : 'No messages yet'}</div>
                        </div>
                        ${unread > 0 ? `<div class="notification-badge">${unread > 9 ? '9+' : unread}</div>` : ''}
                    </div>
                `;
            }).join('');
        }
        
        // ========== DISCOVER USERS ==========
        async function loadDiscover() {
            let container = document.getElementById('discoverList');
            if (!container) return;
            container.innerHTML = '<div class="loading">Loading users...</div>';
            
            try {
                let snapshot = await db.collection('users').where('uid', '!=', currentUser.uid).get();
                let users = [];
                snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));
                
                for (let user of users) {
                    user.isFollowing = user.followers?.includes(currentUser.uid) || false;
                }
                
                container.innerHTML = users.map(user => {
                    let avatar = user.photoURL || getDefaultAvatar(user.username);
                    let followBtn = user.isFollowing ? 
                        `<button class="btn" style="padding:8px 16px; font-size:12px; width:auto; background:var(--text-secondary);" onclick="event.stopPropagation(); unfollowUser('${user.id}')">Following</button>` :
                        `<button class="btn" style="padding:8px 16px; font-size:12px; width:auto;" onclick="event.stopPropagation(); followUser('${user.id}')">Follow</button>`;
                    
                    return `
                        <div class="user-card" onclick="viewProfile('${user.id}')">
                            <div style="position: relative;">
                                <img src="${avatar}" class="avatar" onerror="this.src='${getDefaultAvatar(user.username)}'">
                                <div class="online-indicator" style="background: ${user.online ? 'var(--online)' : 'var(--offline)'};"></div>
                            </div>
                            <div class="user-details">
                                <div class="user-name">${escapeHtml(user.username)}</div>
                                <div class="user-bio">${escapeHtml(user.name || user.username)}</div>
                            </div>
                            ${followBtn}
                            <button class="icon-btn" style="font-size:18px;" onclick="event.stopPropagation(); openChat('${user.id}')">💬</button>
                        </div>
                    `;
                }).join('');
            } catch(err) { console.error(err); }
        }
        
        // ========== CHAT ==========
        async function openChat(userId) {
            let userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                selectedUser = { id: userDoc.id, ...userDoc.data() };
                currentScreen = 'chat';
                render();
            }
        }
        
        function getChatTheme() {
            let themeKey = [currentUser.uid, selectedUser?.id].sort().join('_');
            return chatThemes[themeKey] || 'default';
        }
        
        function getChatThemeColors(themeName) {
            switch(themeName) {
                case 'romantic': return { bg: '#ffe6f0', primary: '#ff6b9d', surface: '#fff0f5' };
                case 'dark': return { bg: '#1a1a2e', primary: '#16213e', surface: '#0f3460' };
                case 'nature': return { bg: '#e8f5e9', primary: '#2e7d32', surface: '#c8e6c9' };
                default: return { bg: 'var(--bg)', primary: 'var(--primary)', surface: 'var(--surface)' };
            }
        }
        
        async function loadMessages() {
            let container = document.getElementById('messagesArea');
            if (!container || !selectedUser) return;
            
            // Apply chat theme
            let themeName = getChatTheme();
            let colors = getChatThemeColors(themeName);
            container.style.setProperty('--chat-bg', colors.bg);
            container.style.setProperty('--chat-primary', colors.primary);
            container.style.setProperty('--chat-surface', colors.surface);
            
            let chatId = [currentUser.uid, selectedUser.id].sort().join('_');
            
            if (messagesUnsubscribe) messagesUnsubscribe();
            messagesUnsubscribe = db.collection(`chats/${chatId}/messages`)
                .orderBy('timestamp')
                .onSnapshot(snapshot => {
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="loading">No messages yet</div>';
                        return;
                    }
                    let messages = [];
                    snapshot.forEach(doc => {
                        let data = doc.data();
                        messages.push({
                            id: doc.id,
                            text: data.text,
                            senderId: data.senderId,
                            timestamp: data.timestamp?.toDate?.() || new Date(),
                            read: data.read,
                            attachment: data.attachment
                        });
                    });
                    
                    container.innerHTML = messages.map(msg => {
                        let isMine = msg.senderId === currentUser.uid;
                        let time = msg.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        let status = isMine ? (msg.read ? 'Seen' : 'Sent') : '';
                        let content = '';
                        if (msg.attachment) {
                            content = `<img src="${msg.attachment}" style="max-width: 200px; max-height: 200px; border-radius: 10px; cursor: pointer;" onclick="window.open('${msg.attachment}','_blank')">`;
                        } else {
                            content = escapeHtml(msg.text);
                        }
                        return `
                            <div class="message ${isMine ? 'message-mine' : 'message-theirs'}">
                                ${content}
                                <div class="message-time">${time} <span style="font-size: 10px;">${status}</span></div>
                            </div>
                        `;
                    }).join('');
                    container.scrollTop = container.scrollHeight;
                    
                    let unread = messages.filter(m => !m.read && m.senderId !== currentUser.uid);
                    if (unread.length) {
                        let batch = db.batch();
                        unread.forEach(m => batch.update(db.collection(`chats/${chatId}/messages`).doc(m.id), { read: true }));
                        batch.commit();
                    }
                });
        }
        
        async function sendMessage() {
            let input = document.getElementById('messageInput');
            let text = input?.value.trim();
            if (!text && !pendingFile) return;
            
            let chatId = [currentUser.uid, selectedUser.id].sort().join('_');
            
            if (pendingFile) {
                try {
                    let url = await uploadToCloudinary(pendingFile);
                    await db.collection(`chats/${chatId}/messages`).add({
                        attachment: url,
                        senderId: currentUser.uid,
                        receiverId: selectedUser.id,
                        timestamp: new Date(),
                        read: false
                    });
                    pendingFile = null;
                    document.getElementById('filePreview')?.remove();
                    showToast('Image sent!');
                } catch(err) { showToast('Upload failed'); }
            }
            
            if (text) {
                await db.collection(`chats/${chatId}/messages`).add({
                    text: text,
                    senderId: currentUser.uid,
                    receiverId: selectedUser.id,
                    timestamp: new Date(),
                    read: false
                });
                input.value = '';
            }
        }
        
        function attachFile() {
            let input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                let file = e.target.files[0];
                if (file) {
                    pendingFile = file;
                    let preview = document.getElementById('filePreview');
                    if (!preview) {
                        preview = document.createElement('div');
                        preview.id = 'filePreview';
                        preview.style.cssText = 'position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 10px 15px; border-radius: 20px; display: flex; gap: 10px; align-items: center; z-index: 1000; border: 1px solid var(--border);';
                        document.body.appendChild(preview);
                    }
                    let reader = new FileReader();
                    reader.onload = (ev) => {
                        preview.innerHTML = `<img src="${ev.target.result}" style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover;"><span>${file.name.substring(0, 20)}</span><button onclick="cancelAttachment()" style="background: none; border: none; font-size: 18px; cursor: pointer;">✕</button>`;
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }
        
        function cancelAttachment() {
            pendingFile = null;
            document.getElementById('filePreview')?.remove();
        }
        
        // ========== PROFILE & FOLLOW ==========
        async function viewProfile(userId) {
            viewingProfileUser = userId;
            currentScreen = 'viewProfile';
            render();
        }
        
        async function loadProfile(userId = null) {
            let uid = userId || currentUser.uid;
            let container = document.getElementById('profileContent');
            if (!container) return;
            
            let doc = await db.collection('users').doc(uid).get();
            let user = doc.data();
            let avatar = user.photoURL || getDefaultAvatar(user.username);
            let isOwn = uid === currentUser.uid;
            let isFollowing = user.followers?.includes(currentUser.uid) || false;
            
            container.innerHTML = `
                <div style="padding: 20px;">
                    <img src="${avatar}" class="profile-avatar" onerror="this.src='${getDefaultAvatar(user.username)}'" ${isOwn ? 'onclick="editProfilePhoto()"' : ''}>
                    <h2 style="text-align: center;">${escapeHtml(user.username)}</h2>
                    <p style="text-align: center; color: var(--text-secondary);">${escapeHtml(user.name || user.username)}</p>
                    <div class="profile-bio" style="text-align: center; padding: 0 20px; color: var(--text-secondary);">${user.bio || 'No bio yet'}</div>
                    <div class="profile-stats">
                        <div class="stat" onclick="showFollowList('followers', '${uid}')">
                            <div class="stat-number">${user.followers?.length || 0}</div>
                            <div class="stat-label">Followers</div>
                        </div>
                        <div class="stat" onclick="showFollowList('following', '${uid}')">
                            <div class="stat-number">${user.following?.length || 0}</div>
                            <div class="stat-label">Following</div>
                        </div>
                    </div>
                    ${!isOwn ? `
                        <button class="btn" onclick="followUser('${uid}')" style="margin-bottom: 10px;">${isFollowing ? 'Unfollow' : 'Follow'}</button>
                        <button class="btn" onclick="openChat('${uid}')" style="background: var(--text-secondary);">Send Message</button>
                    ` : `
                        <button class="btn" onclick="editProfilePhoto()" style="margin-bottom: 10px;">📸 Change Profile Photo</button>
                        <button class="btn" onclick="toggleTheme()" style="margin-bottom: 10px;">🎨 Change App Theme</button>
                        <button class="btn" onclick="logout()" style="background: var(--error);">Logout</button>
                    `}
                </div>
            `;
        }
        
        async function editProfilePhoto() {
            let input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                let file = e.target.files[0];
                if (file) {
                    showToast('Uploading...');
                    try {
                        let url = await uploadToCloudinary(file);
                        await db.collection('users').doc(currentUser.uid).update({ photoURL: url });
                        await currentUser.updateProfile({ photoURL: url });
                        showToast('Profile photo updated!');
                        if (currentScreen === 'profile') loadProfile();
                        render();
                    } catch(err) { showToast('Upload failed'); }
                }
            };
            input.click();
        }
        
        async function followUser(userId) {
            let userRef = db.collection('users').doc(userId);
            let curRef = db.collection('users').doc(currentUser.uid);
            let userDoc = await userRef.get();
            let isFollowing = userDoc.data()?.followers?.includes(currentUser.uid);
            
            if (isFollowing) {
                await userRef.update({ followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
                await curRef.update({ following: firebase.firestore.FieldValue.arrayRemove(userId) });
                showToast(`Unfollowed ${userDoc.data().username}`);
            } else {
                await userRef.update({ followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
                await curRef.update({ following: firebase.firestore.FieldValue.arrayUnion(userId) });
                showToast(`Following ${userDoc.data().username}`);
            }
            
            if (currentScreen === 'viewProfile') loadProfile(viewingProfileUser);
            if (currentScreen === 'discover') loadDiscover();
        }
        
        async function unfollowUser(userId) {
            await followUser(userId);
        }
        
        async function showFollowList(type, userId) {
            let doc = await db.collection('users').doc(userId).get();
            let ids = type === 'followers' ? (doc.data()?.followers || []) : (doc.data()?.following || []);
            if (ids.length === 0) {
                showToast(`No ${type}`);
                return;
            }
            
            let users = [];
            for (let id of ids) {
                let u = await db.collection('users').doc(id).get();
                if (u.exists) users.push({ id: u.id, ...u.data() });
            }
            
            let modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 style="margin-bottom: 15px;">${type === 'followers' ? 'Followers' : 'Following'}</h3>
                    ${users.map(u => `
                        <div class="user-card" style="margin-bottom: 10px;" onclick="viewProfile('${u.id}'); document.querySelector('.modal').remove()">
                            <img src="${u.photoURL || getDefaultAvatar(u.username)}" class="avatar" style="width: 44px; height: 44px;">
                            <div class="user-details">
                                <div class="user-name">${escapeHtml(u.username)}</div>
                                <div class="user-bio">${escapeHtml(u.name || u.username)}</div>
                            </div>
                        </div>
                    `).join('')}
                    <button class="btn" onclick="this.closest('.modal').remove()" style="margin-top: 15px;">Close</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        // ========== CHAT THEMES ==========
        function changeChatTheme() {
            let modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Choose Chat Theme</h3>
                    <div class="theme-option" onclick="setChatTheme('default'); modal.remove()">
                        <i class="fas fa-palette"></i> Default
                    </div>
                    <div class="theme-option" onclick="setChatTheme('romantic'); modal.remove()">
                        <i class="fas fa-heart"></i> Romantic (Pink)
                    </div>
                    <div class="theme-option" onclick="setChatTheme('dark'); modal.remove()">
                        <i class="fas fa-moon"></i> Dark Mode
                    </div>
                    <div class="theme-option" onclick="setChatTheme('nature'); modal.remove()">
                        <i class="fas fa-leaf"></i> Nature (Green)
                    </div>
                    <button class="btn" onclick="this.closest('.modal').remove()" style="margin-top: 15px;">Cancel</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function setChatTheme(themeName) {
            let themeKey = [currentUser.uid, selectedUser.id].sort().join('_');
            chatThemes[themeKey] = themeName;
            localStorage.setItem('chatThemes', JSON.stringify(chatThemes));
            showToast(`Chat theme changed to ${themeName}`);
            loadMessages(); // Refresh with new theme
        }
        
        // ========== NAVIGATION ==========
        function goToChats() { currentScreen = 'chats'; selectedUser = null; render(); }
        function goToDiscover() { currentScreen = 'discover'; render(); }
        function goToProfile() { currentScreen = 'profile'; render(); }
        function goBack() {
            if (messagesUnsubscribe) messagesUnsubscribe();
            currentScreen = 'chats';
            selectedUser = null;
            viewingProfileUser = null;
            render();
        }
        
        function toggleTheme() {
            let themes = ['light', 'dark', 'futuristic'];
            let currentIndex = themes.indexOf(currentTheme);
            currentTheme = themes[(currentIndex + 1) % themes.length];
            applyTheme();
            showToast(`${currentTheme} theme`);
        }
        
        async function logout() {
            await updatePresence(false);
            await auth.signOut();
            currentUser = null;
            currentScreen = 'login';
            render();
        }
        
        // ========== AUTH ==========
        async function handleLogin(e) {
            e.preventDefault();
            let email = document.getElementById('loginEmail').value;
            let password = document.getElementById('loginPassword').value;
            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch(err) { alert(err.message); }
        }
        
        async function handleSignup(e) {
            e.preventDefault();
            let username = document.getElementById('signupUsername').value;
            let name = document.getElementById('signupName').value;
            let email = document.getElementById('signupEmail').value;
            let password = document.getElementById('signupPassword').value;
            let confirm = document.getElementById('signupConfirm').value;
            
            if (password !== confirm) { alert('Passwords do not match'); return; }
            
            try {
                let cred = await auth.createUserWithEmailAndPassword(email, password);
                await cred.user.updateProfile({ displayName: username });
                await db.collection('users').doc(cred.user.uid).set({
                    uid: cred.user.uid, username, name: name || username, email,
                    photoURL: getDefaultAvatar(username), bio: '',
                    isPrivate: false, followers: [], following: [],
                    online: true, lastSeen: new Date(), createdAt: new Date()
                });
                showToast('Account created! Please login.');
                currentScreen = 'login';
                render();
            } catch(err) { alert(err.message); }
        }
        
        function showLogin() { currentScreen = 'login'; render(); }
        function showSignup() { currentScreen = 'signup'; render(); }
        
        // ========== RENDER ==========
        function render() {
            let app = document.getElementById('app');
            
            if (!currentUser) {
                if (currentScreen === 'signup') {
                    app.innerHTML = `
                        <div class="auth-container">
                            <div class="auth-card">
                                <h2>Create Account</h2>
                                <form id="signupForm">
                                    <input type="text" id="signupUsername" placeholder="Username" required>
                                    <input type="text" id="signupName" placeholder="Full Name">
                                    <input type="email" id="signupEmail" placeholder="Email" required>
                                    <input type="password" id="signupPassword" placeholder="Password (min 6)" required>
                                    <input type="password" id="signupConfirm" placeholder="Confirm Password" required>
                                    <button type="submit" class="btn">Sign Up</button>
                                </form>
                                <button class="btn-secondary" onclick="showLogin()">Back to Login</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('signupForm')?.addEventListener('submit', handleSignup);
                } else {
                    app.innerHTML = `
                        <div class="auth-container">
                            <div class="auth-card">
                                <h1>📸 InstaGrab</h1>
                                <form id="loginForm">
                                    <input type="email" id="loginEmail" placeholder="Email" required>
                                    <input type="password" id="loginPassword" placeholder="Password" required>
                                    <button type="submit" class="btn">Login</button>
                                </form>
                                <button class="btn-secondary" onclick="showSignup()">Create account</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('loginForm')?.addEventListener('submit', handleLogin);
                }
                return;
            }
            
            if (currentScreen === 'chat') {
                app.innerHTML = `
                    <div class="chat-container">
                        <div class="chat-header">
                            <button class="back-btn" onclick="goBack()">←</button>
                            <img src="${selectedUser?.photoURL || getDefaultAvatar(selectedUser?.username)}" class="avatar chat-header-avatar" style="width: 44px; height: 44px; cursor: pointer;" onclick="viewProfile('${selectedUser?.id}')">
                            <div style="flex: 1; cursor: pointer;" onclick="viewProfile('${selectedUser?.id}')">
                                <div class="user-name">${escapeHtml(selectedUser?.username)}</div>
                                <div style="font-size: 11px; color: var(--text-secondary);">${selectedUser?.online ? '🟢 Online' : '⚫ Offline'}</div>
                            </div>
                            <button class="icon-btn" onclick="changeChatTheme()">🎨</button>
                        </div>
                        <div id="messagesArea" class="messages-area"><div class="loading">Loading...</div></div>
                        <div class="input-area">
                            <button class="icon-btn" onclick="attachFile()">📎</button>
                            <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                            <button class="btn" onclick="sendMessage()" style="width: auto; padding: 12px 20px;">Send</button>
                        </div>
                    </div>
                `;
                loadMessages();
            } else if (currentScreen === 'discover') {
                app.innerHTML = `
                    <div>
                        <div class="header">
                            <h2>🔍 Discover</h2>
                            <div class="header-icons">
                                <button class="icon-btn" onclick="goToProfile()"><img src="${currentUser?.photoURL || getDefaultAvatar(currentUser?.displayName)}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;"></button>
                                <button class="icon-btn" onclick="toggleTheme()">🎨</button>
                            </div>
                        </div>
                        <div id="discoverList" class="discover-list"><div class="loading">Loading...</div></div>
                        <div class="bottom-nav">
                            <button class="nav-item" onclick="goToChats()"><i class="fas fa-comment"></i><span>Chats</span></button>
                            <button class="nav-item active" onclick="goToDiscover()"><i class="fas fa-compass"></i><span>Discover</span></button>
                            <button class="nav-item" onclick="goToProfile()"><i class="fas fa-user"></i><span>Profile</span></button>
                        </div>
                    </div>
                `;
                loadDiscover();
            } else if (currentScreen === 'profile') {
                app.innerHTML = `
                    <div class="profile-container">
                        <div class="profile-header">
                            <button class="back-btn" onclick="goToChats()">←</button>
                            <h2>My Profile</h2>
                        </div>
                        <div id="profileContent"><div class="loading">Loading...</div></div>
                        <div class="bottom-nav">
                            <button class="nav-item" onclick="goToChats()"><i class="fas fa-comment"></i><span>Chats</span></button>
                            <button class="nav-item" onclick="goToDiscover()"><i class="fas fa-compass"></i><span>Discover</span></button>
                            <button class="nav-item active" onclick="goToProfile()"><i class="fas fa-user"></i><span>Profile</span></button>
                        </div>
                    </div>
                `;
                loadProfile();
            } else if (currentScreen === 'viewProfile') {
                app.innerHTML = `
                    <div class="profile-container">
                        <div class="profile-header">
                            <button class="back-btn" onclick="goBack()">←</button>
                            <h2>Profile</h2>
                        </div>
                        <div id="profileContent"><div class="loading">Loading...</div></div>
                    </div>
                `;
                loadProfile(viewingProfileUser);
            } else {
                app.innerHTML = `
                    <div>
                        <div class="header">
                            <h2>📸 InstaGrab</h2>
                            <div class="header-icons">
                                <button class="icon-btn" onclick="goToProfile()"><img src="${currentUser?.photoURL || getDefaultAvatar(currentUser?.displayName)}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;"></button>
                                <button class="icon-btn" onclick="toggleTheme()">🎨</button>
                            </div>
                        </div>
                        <div id="usersList" class="users-list"><div class="loading">Loading...</div></div>
                        <div class="bottom-nav">
                            <button class="nav-item active" onclick="goToChats()"><i class="fas fa-comment"></i><span>Chats</span></button>
                            <button class="nav-item" onclick="goToDiscover()"><i class="fas fa-compass"></i><span>Discover</span></button>
                            <button class="nav-item" onclick="goToProfile()"><i class="fas fa-user"></i><span>Profile</span></button>
                        </div>
                    </div>
                `;
                loadUsers();
            }
        }
        
        // Make functions global
        window.openChat = openChat;
        window.sendMessage = sendMessage;
        window.viewProfile = viewProfile;
        window.followUser = followUser;
        window.unfollowUser = unfollowUser;
        window.goToChats = goToChats;
        window.goToDiscover = goToDiscover;
        window.goToProfile = goToProfile;
        window.goBack = goBack;
        window.toggleTheme = toggleTheme;
        window.logout = logout;
        window.showLogin = showLogin;
        window.showSignup = showSignup;
        window.showFollowList = showFollowList;
        window.attachFile = attachFile;
        window.cancelAttachment = cancelAttachment;
        window.editProfilePhoto = editProfilePhoto;
        window.changeChatTheme = changeChatTheme;
        window.setChatTheme = setChatTheme;
        
        // ========== AUTH STATE ==========
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                let ref = db.collection('users').doc(user.uid);
                let doc = await ref.get();
                if (!doc.exists) {
                    await ref.set({
                        uid: user.uid,
                        username: user.displayName || user.email.split('@')[0],
                        email: user.email,
                        photoURL: getDefaultAvatar(user.displayName || user.email),
                        bio: '',
                        isPrivate: false,
                        followers: [],
                        following: [],
                        online: true,
                        lastSeen: new Date(),
                        createdAt: new Date()
                    });
                }
                currentScreen = 'chats';
            }
            render();
        });
        
        applyTheme();
    </script>
</body>
</html>
